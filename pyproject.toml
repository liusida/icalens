[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icalens"
version = "0.3.0.dev0"
description = "Fit, share, and apply ICA lenses for language-model activations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Sida Liu" }, { name = "Feijiang Han" }]
keywords = ["interpretability", "ICA", "language-models", "activations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "gb10-load-llm>=0.1.2",
    "huggingface-hub>=0.25",
    "numpy>=1.24",
    "safetensors>=0.4",
    "torch>=2.1",
    "tqdm>=4.66",
    "transformers>=5.0",
]

[project.urls]
Homepage = "https://liusida.github.io/ica-lens-paper/"
Repository = "https://github.com/liusida/icalens"

[dependency-groups]
dev = [
    "build>=1.2",
    "datasets>=4.0",
    "gb10-load-llm>=0.1.2",
    "hatchling>=1.27",
    "matplotlib>=3.9",
    "mypy>=1.11",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "transformers>=5.0",
    "types-tqdm>=4.66",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icalens"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["icalens"]
